# Source of truth for py/step_render.py (Mermaid diagram + docs/index.html).
# Edit this file by hand. Never hand-edit docs/index.html or dist/architecture.mmd
# — both are generated and overwritten by `python main.py render`.
#
# Schema per entry under `repos`:
#   id            unique slug, used as the Mermaid node id and as a `consumes[].from` target
#   kind          "repo" or "external-system"
#   org           GitHub org (null for external systems)
#   url           repo/system URL, or null if none exists yet
#   role          one sentence, what the thing does
#   status_level  "done" | "in-progress" | "error" — drives the coloured badge on the
#                 public page. Keep it honest: "done" means the thing currently works and
#                 nothing is blocking it, not that every to-do is closed.
#   status        one short sentence, the detail behind status_level. Long narrative
#                 (dated findings, patch history) belongs in the repo's own PRIMER.md /
#                 FDOx-Squirrel-Plan.md, not here — this file is what a stranger reads first.
#   produces      list of {artifact, format, note}
#   consumes      list of {from, artifact, format, note} — `from` is another entry's
#                 id, or null if the input comes from outside the family

family: fdox

repos:
  - id: fdo-squirrel-md-generator
    kind: repo
    org: FDOx-squirrel
    url: https://github.com/FDOx-squirrel/fdo-squirrel-md-generator
    role: >-
      Generates MD.cff and CITATION.cff for an FDO package.
    status_level: in-progress
    status: >-
      Decisions done, no code yet.
    produces:
      - artifact: MD.cff, CITATION.cff
        format: YAML
        note: not yet built
    consumes: []

  - id: fdo-squirrel
    kind: repo
    org: FDOx-squirrel
    url: https://github.com/FDOx-squirrel/fdo-squirrel
    role: >-
      FDOx reference implementation: reads an FDO package (ZIP), writes
      fdo-metadata.ttl.
    status_level: done
    status: "v0.1, published (Zenodo DOI 10.5281/zenodo.18441772)"
    produces:
      - artifact: fdo-metadata.ttl
        format: RDF/Turtle
        note: "DCAT + FDO vocabulary, subject = dcat:Dataset + fdo:*FDO"
      - artifact: rdf_modelling_report.json / .html
        format: JSON/HTML
        note: side output per package
    consumes:
      - from: fdo-squirrel-md-generator
        artifact: MD.cff, CITATION.cff
        format: YAML
        note: >-
          Assumed link, not verified — see PRIMER.md Teil D.
      - from: null
        artifact: FDO package (ZIP)
        format: "model/data files + metadata"
        note: input from outside the family.

  - id: fdo-squirrel-spec
    kind: repo
    org: FDOx-squirrel
    url: https://github.com/FDOx-squirrel/fdo-squirrel-spec
    role: >-
      Documentation: renders a ReSpec page from copies of the schema,
      RDF crosswalk, classification rules and two real worked examples.
      Publishes no RDF of its own.
    status_level: in-progress
    status: "S1-S3 done: pinned to fdo-squirrel v0.3.1, two real worked examples"
    produces:
      - artifact: docs/index.html
        format: HTML (ReSpec)
        note: GitHub Pages, no RDF output
    consumes:
      - from: fdo-squirrel
        artifact: >-
          MD.cff-schema.yaml, crosswalk_md_cff_to_rdf.yaml,
          classification_rules.yaml, package_source.py
        format: YAML/Python
        note: "Pinned to tag v0.3.1, not main (S3, 2026-09-04)."
      - from: fdo-squirrel-registry
        artifact: two harvested fdo-metadata.ttl records (one SoftwareFDO, one 3DDataFDO)
        format: RDF/Turtle
        note: >-
          Pulled fresh from main on every fetch (S2, 2026-09-04). One of the
          two is invalid Turtle as harvested (missing @prefix); repaired in
          memory only at render time, never on disk.
        format: YAML/Python
        note: >-
          Snapshotted locally, then rendered offline against it.

  - id: fdo-squirrel-registry
    kind: repo
    org: FDOx-squirrel
    url: https://github.com/FDOx-squirrel/fdo-squirrel-registry
    role: >-
      Harvests FDOx packages published on Zenodo, bundles their RDF
      descriptions into a DCAT catalogue anchored in CIDOC CRM (N4O
      application profile crm-rdf-ap), SHACL-validates the result, and
      serves a facet and SPARQL page via GitHub Pages.
    status_level: done
    status: >-
      Full pipeline through the N4O collection is live; remaining work is
      housekeeping, not blocking.
    produces:
      - artifact: dist/fdo-registry.ttl
        format: RDF/Turtle
        note: >-
          DCAT catalogue + CRM anchors, versioned, the registry's own
          citable output.
      - artifact: dist/fdo-registry-n4o.ttl
        format: RDF/Turtle
        note: >-
          Bundle + CRM bridge + vocabularies in one graph, SHACL-gated —
          what fdox-squirrel-n4o-collection consumes.
      - artifact: dist/registry-index.json
        format: JSON
        note: facet index for the page (type, licence, keyword, place, year).
    consumes:
      - from: fdo-squirrel
        artifact: fdo-metadata.ttl (of packages harvested from Zenodo)
        format: RDF/Turtle
        note: "Source list: curated registry/sources.json of DOIs."

  - id: fdox-squirrel-n4o-collection
    kind: repo
    org: FDOx-squirrel
    url: https://github.com/FDOx-squirrel/fdox-squirrel-n4o-collection
    role: >-
      Collection repository for the NFDI4Objects Knowledge Graph: holds
      only metadata.yaml, lets n4o-kg-profile build the registration
      record, VoID statistics, CRM alignment and a browser SPARQL page
      from it.
    status_level: done
    status: >-
      Live; build and Pages deploy green, push trigger active.
    produces:
      - artifact: dist/n4o-collection.ttl, dist/metadata.ttl
        format: RDF/Turtle, JSON-LD
        note: >-
          Registration record + full DCAT/VoID/CRM statement, published at
          https://fdox-squirrel.github.io/fdox-squirrel-n4o-collection/
    consumes:
      - from: fdo-squirrel-registry
        artifact: dist/fdo-registry-n4o.ttl
        format: RDF/Turtle
        note: >-
          Pulled fresh from raw.githubusercontent.com on every build, not
          committed — changes in the registry reach the next collection
          build without any change here.
      - from: n4o-kg-profile
        artifact: profile/, build/ (SHACL gate, metadata/page generators)
        format: Python/Turtle/SHACL
        note: >-
          uses: n4o-rse/n4o-kg-profile/.github/workflows/collection.yml@v1,
          copied in fresh on every run.

  - id: n4o-kg-profile
    kind: external-system
    org: n4o-rse
    url: https://github.com/n4o-rse/n4o-kg-profile
    role: >-
      Cross-project tool (not part of the FDOx family, but also owned by
      Flo): builds metadata RDF, CIDOC CRM alignment and a browser SPARQL
      page for an NFDI4Objects KG collection from one metadata.yaml.
    status_level: in-progress
    status: >-
      In production use by fdox-squirrel-n4o-collection; still "Draft" by
      its own status (crosswalk not yet reconciled with NCMDP/OCMDP).
    produces: []
    consumes: []

  - id: squirrelbase
    kind: external-system
    org: null
    url: null
    role: >-
      Semantic meta-hub (Wikibase) for 3D objects, holds the FDO URL per
      object.
    status_level: done
    status: "In production, outside this plan"
    produces: []
    consumes:
      - from: fdo-squirrel-registry
        artifact: FDO URL/DOI per object
        format: Link
        note: "Reference only, no TTL data flow."

  - id: fdo-3d-packager
    kind: repo
    org: FDOx-squirrel
    url: https://github.com/FDOx-squirrel/fdo-3d-packager
    role: >-
      Sketchfab or local 3D model -> finished fdo:3DDataFDO package in the
      fdo-squirrel layout (viewer included).
    status_level: in-progress
    status: >-
      Skeleton done (seven steps), implementation not started.
    produces:
      - artifact: fdo:3DDataFDO package (ZIP)
        format: RDF/Turtle + binary data
        note: distributions[] deliberately left empty
    consumes:
      - from: fdo-squirrel
        artifact: MD.cff/CITATION.cff generation, bundling
        format: Python
        note: >-
          Integration path (pip from GitHub vs. submodule vs. external
          path) still open — same question as fdo-git-packager.
      - from: null
        artifact: Sketchfab API or local 3D file
        format: glTF/GLB etc.
        note: input from outside the family.

  - id: fdo-git-packager
    kind: repo
    org: FDOx-squirrel
    url: https://github.com/FDOx-squirrel/fdo-git-packager
    role: >-
      Git repository + pinned commit SHA -> finished fdo:SoftwareFDO
      package, working tree flat at ZIP root.
    status_level: in-progress
    status: >-
      Skeleton done (six steps), implementation not started.
    produces:
      - artifact: fdo:SoftwareFDO package (ZIP)
        format: RDF/Turtle + source code
        note: >-
          Working tree must be flat, or fdo-squirrel's path_prefix
          classification rules don't match.
    consumes:
      - from: fdo-squirrel
        artifact: MD.cff/CITATION.cff generation, bundling
        format: Python
        note: >-
          Same integration question as fdo-3d-packager; also unresolved
          whether an existing CITATION.cff in the target repo should
          always win over a synthesised one.
      - from: null
        artifact: Git repository + commit SHA
        format: source code
        note: input from outside the family.
