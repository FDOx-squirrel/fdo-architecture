# Source of truth for py/step_render.py (Mermaid diagram + docs/index.html).
# Edit this file by hand. Never hand-edit docs/index.html or dist/architecture.mmd
# — both are generated and overwritten by `python main.py render`.
#
# Schema per entry under `repos`:
#   id        unique slug, used as the Mermaid node id and as a `consumes[].from` target
#   kind      "repo" or "external-system"
#   org       GitHub org (null for external systems)
#   url       repo/system URL, or null if none exists yet
#   role      one sentence, what the thing does
#   status    free text, dated where it matters
#   produces  list of {artifact, format, note}
#   consumes  list of {from, artifact, format, note} — `from` is another entry's
#             id, or null if the input comes from outside the family

family: fdox

repos:
  - id: fdo-squirrel-md-generator
    kind: repo
    org: FDOx-squirrel
    url: https://github.com/FDOx-squirrel/fdo-squirrel-md-generator
    role: >-
      Erzeugt MD.cff und CITATION.cff fuer ein FDO-Paket.
    status: >-
      Rolle nur aus dem Repo-Namen erschlossen, nicht am echten Code
      verifiziert (siehe PRIMER.md Teil D).
    produces:
      - artifact: MD.cff, CITATION.cff
        format: YAML
        note: unverifiziert
    consumes: []

  - id: fdo-squirrel
    kind: repo
    org: FDOx-squirrel
    url: https://github.com/FDOx-squirrel/fdo-squirrel
    role: >-
      FDOx-Referenzimplementierung: liest ein FDO-Paket (ZIP), schreibt
      fdo-metadata.ttl.
    status: "v0.1, publiziert (Zenodo DOI 10.5281/zenodo.18441772)"
    produces:
      - artifact: fdo-metadata.ttl
        format: RDF/Turtle
        note: "DCAT + FDO Vokabular, Subjekt = dcat:Dataset + fdo:*FDO"
      - artifact: rdf_modelling_report.json / .html
        format: JSON/HTML
        note: Nebenausgabe je Paket
    consumes:
      - from: fdo-squirrel-md-generator
        artifact: MD.cff, CITATION.cff
        format: YAML
        note: >-
          Vermutete Verbindung, nicht verifiziert — siehe PRIMER.md Teil D.
      - from: null
        artifact: FDO-Paket (ZIP)
        format: "Modell-/Datendateien + Metadaten"
        note: Eingabe von ausserhalb der Familie.

  - id: fdo-squirrel-spec
    kind: repo
    org: FDOx-squirrel
    url: https://github.com/FDOx-squirrel/fdo-squirrel-spec
    role: >-
      Dokumentation: rendert eine ReSpec-Seite aus Kopien von Schema,
      RDF-Crosswalk und Klassifikationsregeln aus fdo-squirrel. Publiziert
      selbst kein neues RDF.
    status: "S1 gebaut (2026-09-03), docs/index.html rendert offline"
    produces:
      - artifact: docs/index.html
        format: HTML (ReSpec)
        note: GitHub Pages, keine RDF-Ausgabe
    consumes:
      - from: fdo-squirrel
        artifact: >-
          MD.cff-schema.yaml, crosswalk_md_cff_to_rdf.yaml,
          classification_rules.yaml, package_source.py
        format: YAML/Python
        note: >-
          Snapshot in data/raw/ per "python main.py fetch"; render laeuft
          danach offline dagegen.

  - id: fdo-squirrel-registry
    kind: repo
    org: FDOx-squirrel
    url: https://github.com/FDOx-squirrel/fdo-squirrel-registry
    role: >-
      Erntet auf Zenodo publizierte FDOx-Pakete, buendelt ihre
      RDF-Beschreibungen zu einem DCAT-Katalog, verankert an CIDOC CRM
      (N4O-Anwendungsprofil crm-rdf-ap) und SHACL-validiert das Ergebnis,
      liefert Facetten- und SPARQL-Seite ueber GitHub Pages.
    status: >-
      S0-S9 fertig (Stand 2026-09-04), inkl. eigenem FDO-Release (S8) und
      N4O-Andockung (S9, siehe fdox-squirrel-n4o-collection). S10 laeuft:
      Restarbeiten, u.a. der Zenodo-Publish des eigenen Release-Bundles.
    produces:
      - artifact: dist/fdo-registry.ttl
        format: RDF/Turtle
        note: >-
          DCAT-Katalog + CRM-Anker, versioniert, zitierbares Erzeugnis der
          Registry selbst.
      - artifact: dist/fdo-registry-n4o.ttl
        format: RDF/Turtle
        note: >-
          Bundle + CRM-Bruecke + Vokabulare in einem Graph, SHACL-gated
          (S5) — das ist, was fdox-squirrel-n4o-collection uebernimmt.
      - artifact: dist/registry-index.json
        format: JSON
        note: Facettenindex fuer die Seite (Typ, Lizenz, Keyword, Ort, Jahr).
    consumes:
      - from: fdo-squirrel
        artifact: fdo-metadata.ttl (von Zenodo geernteter Pakete)
        format: RDF/Turtle
        note: "Quellenliste: kuratiertes registry/sources.json mit DOIs."

  - id: fdox-squirrel-n4o-collection
    kind: repo
    org: FDOx-squirrel
    url: https://github.com/FDOx-squirrel/fdox-squirrel-n4o-collection
    role: >-
      Collection-Repo fuer den NFDI4Objects Knowledge Graph: haelt nur
      metadata.yaml, laesst n4o-kg-profile daraus Registrierungssatz,
      VoID-Statistik, CRM-Alignment und eine Browser-SPARQL-Seite bauen.
    status: >-
      Live seit 2026-09-04. Build und Pages-Deploy gruen, push-Trigger
      aktiv. metadata.yaml/id und /homepage zeigen noch auf die GitHub-URL
      der Registry statt einer echten DOI (haengt am Zenodo-Publish von
      fdo-squirrel-registry S8, siehe dort S10).
    produces:
      - artifact: dist/n4o-collection.ttl, dist/metadata.ttl
        format: RDF/Turtle, JSON-LD
        note: >-
          Registrierungssatz + volle DCAT/VoID/CRM-Aussage, veroeffentlicht
          unter https://fdox-squirrel.github.io/fdox-squirrel-n4o-collection/
    consumes:
      - from: fdo-squirrel-registry
        artifact: dist/fdo-registry-n4o.ttl
        format: RDF/Turtle
        note: >-
          Per raw.githubusercontent.com bei jedem Build frisch gezogen,
          nicht committet — Aenderungen an der Registry landen ohne
          eigenes Zutun im naechsten Collection-Build.
      - from: n4o-kg-profile
        artifact: profile/, build/ (SHACL-Gate, Metadaten-/Seiten-Generatoren)
        format: Python/Turtle/SHACL
        note: >-
          uses: n4o-rse/n4o-kg-profile/.github/workflows/collection.yml@v1,
          kopiert bei jedem Lauf frisch rein.

  - id: n4o-kg-profile
    kind: external-system
    org: n4o-rse
    url: https://github.com/n4o-rse/n4o-kg-profile
    role: >-
      Projektuebergreifendes Werkzeug (nicht Teil der FDOx-Familie, gehoert
      aber ebenfalls Flo): baut aus einer metadata.yaml Metadaten-RDF,
      CIDOC-CRM-Alignment und eine Browser-SPARQL-Seite fuer eine
      NFDI4Objects-KG-Collection.
    status: >-
      In Benutzung durch fdox-squirrel-n4o-collection, drei Bugs am
      2026-09-04 direkt gepatcht und in echtem CI verifiziert (kein
      v1-Tag; Checkout auf einen 404-Org-Pfad; Selbst-Checkout via
      github.action_ref loeste auf den falschen Ref auf, behoben durch
      github.action_path). "Draft" laut eigenem Status — Crosswalk/Shapes
      noch nicht mit dem verbindlichen NCMDP/OCMDP abgeglichen.
    produces: []
    consumes: []

  - id: squirrelbase
    kind: external-system
    org: null
    url: null
    role: >-
      Semantischer Meta-Hub (Wikibase) fuer 3D-Objekte, haelt die FDO-URL
      je Objekt.
    status: "produktiv, ausserhalb dieses Plans"
    produces: []
    consumes:
      - from: fdo-squirrel-registry
        artifact: FDO-URL/DOI je Objekt
        format: Link
        note: "Verknuepfung, kein TTL-Datenfluss."

  - id: fdo-3d-packager
    kind: repo
    org: FDOx-squirrel
    url: https://github.com/FDOx-squirrel/fdo-3d-packager
    role: >-
      Sketchfab- oder lokales 3D-Modell -> fertiges fdo:3DDataFDO-Paket im
      fdo-squirrel-Layout (Viewer inklusive).
    status: >-
      S0-S1 fertig (Skeleton, sieben Schritte als Initial Commit), S2-S7
      (Implementierung) offen. Naechster Schritt laut Flo: erst committen,
      dann in der Praxis testen und zurueckmelden, was bricht.
    produces:
      - artifact: fdo:3DDataFDO-Paket (ZIP)
        format: RDF/Turtle + Binaerdaten
        note: distributions[] bewusst nicht vorbefuellt
    consumes:
      - from: fdo-squirrel
        artifact: MD.cff/CITATION.cff-Erzeugung, Bundling
        format: Python
        note: >-
          Einbindungsmechanismus (pip aus GitHub vs. Submodule vs.
          externer Pfad) noch offen — identische Frage wie bei
          fdo-git-packager.
      - from: null
        artifact: Sketchfab-API oder lokale 3D-Datei
        format: glTF/GLB u.a.
        note: Eingabe von ausserhalb der Familie.

  - id: fdo-git-packager
    kind: repo
    org: FDOx-squirrel
    url: https://github.com/FDOx-squirrel/fdo-git-packager
    role: >-
      Git-Repo + fester Commit-SHA -> fertiges fdo:SoftwareFDO-Paket,
      Working Tree flach auf ZIP-Root.
    status: >-
      S0-S1 fertig (Skeleton, sechs Schritte als Initial Commit), S2-S6
      (Implementierung) offen. Naechster Schritt laut Flo: erst committen,
      dann in der Praxis testen und zurueckmelden, was bricht.
    produces:
      - artifact: fdo:SoftwareFDO-Paket (ZIP)
        format: RDF/Turtle + Quellcode
        note: >-
          Working Tree flach, sonst greifen fdo-squirrels
          path_prefix-Klassifikationsregeln nicht.
    consumes:
      - from: fdo-squirrel
        artifact: MD.cff/CITATION.cff-Erzeugung, Bundling
        format: Python
        note: >-
          Gleiche Einbindungsfrage wie bei fdo-3d-packager; zusaetzlich
          unbestaetigt, ob eine im Ziel-Repo vorhandene CITATION.cff
          Vorrang vor einer synthetisierten haben soll.
      - from: null
        artifact: Git-Repo + Commit-SHA
        format: Quellcode
        note: Eingabe von ausserhalb der Familie.
